<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RetroBat Cab Commander Marquee</title>
    <link rel="stylesheet" href="/marquee.css" />
  </head>
  <body>
    <main class="marquee-shell">
      <section class="artwork-frame">
        <img id="artwork" alt="" hidden />
        <div id="fallback" class="fallback">RetroBat Cab Commander</div>
      </section>
      <footer>
        <div>
          <p id="system">Waiting for game</p>
          <h1 id="title">RetroBat Cab Commander</h1>
        </div>
        <p id="status">Loading marquee...</p>
      </footer>
    </main>
    <script src="/marquee.js"></script>
  </body>
</html>
