# Copy this file to config.toml and edit for your cabinet.

# Leave retrobat_root blank for automatic detection, or set it to force a path.
auto_detect_retrobat = true
retrobat_root = ""
api_token = "change-this-token"
bind_host = "127.0.0.1"
port = 8765

favorite_systems = ["arcade", "nes", "snes", "windows"]
frontend_process_names = ["retrobat.exe", "emulationstation.exe"]
emulator_process_names = ["retroarch.exe"]

# Optional: override automatic discovery.
# es_systems_cfg = "C:/RetroBat/emulationstation/.emulationstation/es_systems.cfg"

allow_rom_symlinks = true
experimental_direct_es_launch = false

cors_enabled = false
cors_origins = []
log_dir = "logs"

safe_power_wait_seconds = 10
allow_force_kill_emulators = false

marquee_enabled = false
marquee_refresh_seconds = 5
marquee_artwork_preference = ["marquee", "wheel", "boxart", "screenshot"]

controls_enabled = true
controls_auto_repair_on_launch = true

[launch_rules.windows]
mode = "shell"

[launch_rules.arcade]
mode = "retrobat"

# Unsupported MVP modes such as steam_uri will be reported as warnings and blocked.
# [launch_rules.steam]
# mode = "disabled"

[controller_ports.player1]
label = "Player 1"
usb_location_path = ""

[controller_ports.player2]
label = "Player 2"
usb_location_path = ""
