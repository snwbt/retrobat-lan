[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrobat-cab-commander"
version = "0.1.6"
description = "Local LAN-only RetroBat arcade cabinet companion API and dashboard."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
process = ["psutil>=5.9"]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]
packaging = [
  "pyinstaller>=6",
]

[project.scripts]
retrobat-cab-commander = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
